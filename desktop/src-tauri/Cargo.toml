[package]
name = "grabbox-desktop"
version = "0.3.0"
description = "GrabBox — grab anything from the web, keep it local"
authors = ["GrabBox"]
license = "MIT"
repository = "https://github.com/sharthak18/A-WAY-TO-DOWNLOAD-YOUTUBE-AUDIO-"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[features]
# Reused when the tauri.conf is built through the lib target.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
